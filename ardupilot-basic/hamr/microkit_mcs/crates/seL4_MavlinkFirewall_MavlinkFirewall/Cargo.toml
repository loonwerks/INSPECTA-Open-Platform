# This file will not be overwritten if HAMR codegen is rerun

[package]
name = "seL4_MavlinkFirewall_MavlinkFirewall"
version = "0.1.0"
edition = "2021"

[dependencies]
data = { path = "../data" }
linux-raw-sys = { version = "=0.12.1", default-features = false }
log = "0.4.34"
GumboLib = { path = "../GumboLib" }

# -----------------------------------------------------------------------------
# seL4 Rust crate dependencies
# -----------------------------------------------------------------------------
sel4 = { git = "https://github.com/seL4/rust-sel4", features = ["single-threaded"], optional = true, tag="v5.0.0" }
sel4-logging = { git = "https://github.com/seL4/rust-sel4", optional = true, tag="v5.0.0" }

# -----------------------------------------------------------------------------
# Verus crate dependencies
#
# It is recommended to use the Verus release:
# https://github.com/verus-lang/verus/releases/tag/release/0.2026.08.23.fbbbbcf
# -----------------------------------------------------------------------------
vstd = { version = "=0.0.0-2026-08-23-0033", default-features=false }
verus_builtin = { version = "=0.0.0-2026-08-09-0044" }
verus_builtin_macros = { version = "=0.0.0-2026-08-23-0033" }

mavlink_parser_vest = { path = "../mavlink_parser_vest" }
one-shot-mutex = "0.2.1"
sel4-dlmalloc = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
vest_lib = { git = "https://github.com/secure-foundations/vest", rev = "e0671fbbec7c7a4daeb5581fd12d21ec89ec005c", default-features = false, features = ["alloc"] }

# PLACEHOLDER MARKER R2U2 CARGO DEPENDENCIES

[dev-dependencies]
lazy_static = "1.5.0"
once_cell = "1.21.4"
serial_test = "4.0.1"
proptest = "1.11.0"
env_logger = "0.11.11"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
sel4 = ["dep:sel4", "dep:sel4-logging" ]

[package.metadata.verus]
verify = true

